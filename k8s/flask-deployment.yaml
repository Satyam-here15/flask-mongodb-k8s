apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: satyam150703/flask-mongo-app:v1
          ports:
            - containerPort: 5000
          env:
            - name: MONGODB_URI
              value: "mongodb://admin:admin123@mongodb:27017/flask_db?authSource=admin"
          resources:
            requests:
              cpu: "200m"
              memory: "250Mi"
            limits:
              cpu: "500m"
              memory: "500Mi"